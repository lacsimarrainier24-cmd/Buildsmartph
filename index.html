<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BuildSmart PH — Store</title>
  <style>
    :root {
      --bg:#f7fafc; --card:#ffffff; --accent:#0ea5a4; --muted:#64748b;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:#0f172a;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
    header{background:#0f172a;color:#fff;padding:18px 0}
    .wrap{max-width:1100px;margin:20px auto;padding:12px}
    .layout{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
    h1,h2,h3{margin:0 0 8px 0}
    /* product grid (card style) */
    .products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .product-card{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(2,6,23,0.06);box-shadow:0 6px 18px rgba(2,6,23,0.03);display:flex;flex-direction:column;transition:transform .14s ease, box-shadow .14s ease}
    .product-card:hover{transform:translateY(-6px);box-shadow:0 20px 30px rgba(2,6,23,0.06)}
    .product-card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
    .product-meta{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
    .product-meta .title{font-weight:600}
    .product-meta .price{font-weight:700}
    .desc{color:#475569;font-size:0.95rem;margin-top:6px}
    .row{display:flex;gap:8px;align-items:center}
    .btn{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:600}
    .btn.secondary{background:#64748b}
    .small{font-size:0.95rem;color:#334155}
    /* cart panel */
    aside.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid rgba(2,6,23,0.06)}
    .cart-list{max-height:360px;overflow:auto;margin-top:8px}
    .cart-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #edf2f7}
    .qty{display:inline-block;padding:4px 8px;border-radius:6px;background:#f1f5f9}
    input,textarea,select{padding:8px;border-radius:8px;border:1px solid #e2e8f0;width:100%;box-sizing:border-box;font-size:0.95rem}
    .modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(2,6,23,0.6);display:flex;align-items:center;justify-content:center;z-index:60}
    .modal .box{background:#fff;padding:18px;border-radius:10px;max-width:520px;width:94%}
    #siteNotifications{margin-top:8px}
    footer{padding:22px;text-align:center;color:#475569;margin-top:18px}
    @media (max-width:900px){
      .layout{grid-template-columns:1fr; padding-bottom:40px}
      .products{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 style="font-size:1.25rem">BuildSmart PH — Store</h1>
    </div>
  </header>

  <main class="wrap">
    <div class="layout">
      <!-- Product area -->
      <section>
        <h2>Products</h2>
        <div class="products" id="productList">
          <!-- JS will populate product cards. Replace image src with your images in /images/ or use full URLs -->
        </div>
      </section>

      <!-- Cart Panel -->
      <aside id="cartPanel" class="card">
        <h3>Your Cart</h3>

        <!-- notifications area -->
        <div id="siteNotifications" style="margin-top:8px"></div>

        <div id="cartContents" class="cart-list small"></div>

        <div style="margin-top:10px;display:flex;gap:8px">
          <div style="flex:1">
            <label class="small">Voucher (₱)</label>
            <input id="voucher" placeholder="0" value="0" />
          </div>
          <div style="width:120px">
            <label class="small">Shipping (₱)</label>
            <input id="shipping" type="number" value="0" />
          </div>
        </div>

        <div style="margin-top:10px">
          <label class="small">Payment method</label>
          <select id="paymentMethod">
            <option>GCash</option>
            <option>Bank Transfer</option>
            <option>Cash on Delivery</option>
          </select>
        </div>

        <hr style="margin:12px 0">

        <div>
          <label class="small">Buyer name</label>
          <input id="buyerName" placeholder="Full name" />
          <label class="small" style="margin-top:8px">Buyer email</label>
          <input id="buyerEmail" placeholder="you@example.com" />
          <label class="small" style="margin-top:8px">Address</label>
          <input id="buyerAddress" placeholder="Delivery address" />
          <label class="small" style="margin-top:8px">Phone</label>
          <input id="buyerPhone" placeholder="09xxxxxxxxx" />
        </div>

        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn" onclick="checkout()">Checkout</button>
          <button class="btn secondary" onclick="toggleCart(false)">Hide</button>
        </div>

        <div id="orderActionsArea" style="margin-top:12px"></div>

        <div style="margin-top:12px;font-size:0.9rem;color:#475569">
          <small>Tip: replace product image placeholders in the product objects or in the /images/ folder with your own images.</small>
        </div>
      </aside>
    </div>
  </main>

  <!-- Refund modal -->
  <div id="modal" style="display:none" class="modal">
    <div class="box">
      <h3 id="modalTitle">Request Refund</h3>
      <div id="modalBody">
        <label class="small">Reason</label>
        <textarea id="refundReason" rows="4" placeholder="Describe the problem..."></textarea>
        <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" onclick="submitRefund()">Send Refund Request</button>
          <button class="btn secondary" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden FormSubmit forms -->
  <form id="sellerForm" action="https://formsubmit.co/lacsimarrainier24@gmail.com" method="POST" style="display:none">
    <input type="hidden" name="sellerOrderDetails" id="sellerOrderDetails" />
    <input type="hidden" name="sellerCustomerName" id="sellerCustomerName" />
    <input type="hidden" name="sellerCustomerEmail" id="sellerCustomerEmail" />
  </form>

  <form id="buyerForm" action="" method="POST" style="display:none">
    <input type="hidden" name="buyerOrderDetails" id="buyerOrderDetails" />
    <input type="hidden" name="buyerCustomerName" id="buyerCustomerName" />
  </form>

  <footer>
    BuildSmart PH • Simple e-store demo — replace images and tweak text as needed.
  </footer>

  <script>
    /* ---------------------------
       Product catalog (edit these)
       Replace img paths with your images (e.g. /images/drill.jpg)
       --------------------------- */
    const products = [
      { id:'P001', title:'Cordless Drill', price:2499, img:'images/drill.jpg', desc:'18V cordless drill' },
      { id:'P002', title:'Safety Helmet', price:399, img:'images/helmet.jpg', desc:'Construction safety helmet' },
      { id:'P003', title:'Measuring Tape', price:149, img:'images/tape.jpg', desc:'5m measuring tape' },
      { id:'P004', title:'Work Gloves', price:199, img:'images/gloves.jpg', desc:'Durable work gloves' }
    ];

    // cart and state
    let cart = {}; // { productId: { ...product, qty } }
    let voucherDiscount = 0;
    let lastOrderDetails = null; // { id, details, name, email, total, status }

    /* Render product cards (card-style) */
    function renderProducts(){
      const container = document.getElementById('productList');
      container.innerHTML = '';
      for(const p of products){
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div style="position:relative">
            <img src="${p.img}" alt="${p.title}" onerror="this.style.opacity=0.5; this.nextElementSibling.style.display='block'">
            <div style="display:none;color:#94a3b8;font-size:0.9rem;margin-top:8px">Replace this image: ${p.img}</div>
          </div>
          <div style="margin-top:10px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="title">${p.title}</div>
              <div class="price">₱${p.price.toLocaleString()}</div>
            </div>
            <div class="desc">${p.desc}</div>
            <div style="display:flex;justify-content:flex-end;margin-top:10px">
              <button class="btn" onclick="addToCart('${p.id}')">Add to cart</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    /* Cart functions */
    function addToCart(pid){
      const prod = products.find(x => x.id===pid);
      if(!prod) return;
      if(!cart[pid]) cart[pid] = { ...prod, qty:0 };
      cart[pid].qty += 1;
      renderCart();
      pushSiteNotification('Added to cart', `${prod.title} x${cart[pid].qty}`);
    }
    function removeFromCart(pid){
      if(!cart[pid]) return;
      cart[pid].qty -= 1;
      if(cart[pid].qty <= 0) delete cart[pid];
      renderCart();
    }

    function renderCart(){
      const el = document.getElementById('cartContents');
      el.innerHTML = '';
      let subtotal = 0;
      for(const [k,item] of Object.entries(cart)){
        const row = document.createElement('div');
        row.className = 'cart-row';
        row.innerHTML = `
          <div style="flex:1">
            <strong>${item.title}</strong>
            <div class="small">₱${item.price.toLocaleString()} • <span class="qty">x${item.qty}</span></div>
          </div>
          <div style="text-align:right">
            <div>₱${(item.price*item.qty).toLocaleString()}</div>
            <div style="margin-top:6px;display:flex;gap:6px;justify-content:flex-end">
              <button class="btn secondary" onclick="removeFromCart('${k}')">-</button>
              <button class="btn" onclick="addToCart('${k}')">+</button>
            </div>
          </div>
        `;
        el.appendChild(row);
        subtotal += item.price * item.qty;
      }

      const summary = document.createElement('div');
      summary.style.marginTop = '8px';
      const ship = parseInt(document.getElementById('shipping').value || '0');
      const voucher = parseInt(document.getElementById('voucher').value || '0');
      const total = Math.max(0, subtotal + ship - (voucher || 0));
      summary.innerHTML = `<div class="small">Subtotal: ₱${subtotal.toLocaleString()}</div><div class="small">Shipping: ₱${ship.toLocaleString()}</div><div class="small">Discount: ₱${voucher || 0}</div><hr><strong>Total: ₱${total.toLocaleString()}</strong>`;
      el.appendChild(summary);
    }

    /* Small on-site notifications area */
    function pushSiteNotification(title, text, type = 'info') {
      const container = document.getElementById('siteNotifications');
      const note = document.createElement('div');
      note.style.border = '1px solid #e6f0ff';
      note.style.background = (type==='error' ? '#fff5f5' : '#fbfdff');
      note.style.padding = '8px';
      note.style.borderRadius = '8px';
      note.style.marginBottom = '8px';
      note.innerHTML = `<strong>${title}</strong><div style="font-size:0.95rem;color:#445872;margin-top:6px">${text}</div>`;
      container.prepend(note);
      setTimeout(()=>{ if(note.parentNode) note.parentNode.removeChild(note); }, 12000);
    }

    /* Order/result area after checkout */
    function renderOrderResult() {
      const actionsArea = document.getElementById('orderActionsArea');
      actionsArea.innerHTML = ''; // clear

      const node = document.createElement('div');
      node.id = 'lastOrderBox';
      node.style.border = '1px solid #e6f0ff';
      node.style.padding = '10px';
      node.style.borderRadius = '8px';
      node.style.marginTop = '8px';

      const statusText = lastOrderDetails && lastOrderDetails.status ? lastOrderDetails.status : 'pending';

      node.innerHTML = `
        <strong>Order Submitted</strong>
        <div class="small">Status: <em id="orderStatusText">${statusText}</em></div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <button class="btn" onclick="openModal('refund')">Request Refund</button>
          <button class="btn cancel-btn" onclick="cancelOrderAfterCheckout()">Cancel Order</button>
          <button class="btn" onclick="viewReceipt()">View Receipt</button>
        </div>
      `;
      actionsArea.appendChild(node);
      pushSiteNotification('Order Placed', 'Your order was placed and an e-receipt was emailed to you.', 'info');
    }

    /* Cancel after checkout */
    function cancelOrderAfterCheckout() {
      if(!lastOrderDetails) { alert('No recent order to cancel.'); return; }
      if(lastOrderDetails.status === 'shipped') {
        alert('This order has already been shipped and cannot be canceled. Please request a refund instead.');
        return;
      }
      if(lastOrderDetails.status === 'cancel_requested') {
        alert('Cancellation already requested. We will contact you by email.');
        return;
      }

      const ok = confirm('Are you sure you want to cancel this order? If the order is not shipped, your cancellation request will be sent to BuildSmart PH support.');
      if(!ok) return;

      lastOrderDetails.status = 'cancel_requested';
      const el = document.getElementById('orderStatusText'); if(el) el.innerText = lastOrderDetails.status;

      const txt = `CANCELLATION REQUEST\nCustomer: ${lastOrderDetails.name} (${lastOrderDetails.email})\n\nOrder Details:\n${lastOrderDetails.details}\n\nRequest: Customer requests cancellation before shipment.`;

      document.getElementById('sellerOrderDetails').value = txt;
      document.getElementById('sellerCustomerName').value = lastOrderDetails.name;
      document.getElementById('sellerCustomerEmail').value = lastOrderDetails.email;

      try { document.getElementById('sellerForm').submit(); } catch(e){ console.warn('Seller form submit failed:', e); }

      pushSiteNotification('Cancellation Requested', 'Your cancellation request was sent. If the order is not shipped, we will process it and notify you by email.', 'info');
      alert('Cancellation request sent to BuildSmart PH support. If not shipped, we will cancel and refund per policy.');
    }

    /* Test helper: mark shipped (remove in production if desired) */
    function simulateShipLastOrder() {
      if(!lastOrderDetails) { alert('No order to ship'); return; }
      lastOrderDetails.status = 'shipped';
      const el = document.getElementById('orderStatusText'); if(el) el.innerText = lastOrderDetails.status;
      pushSiteNotification('Order Shipped', 'Order has been marked as shipped. Cancellations are no longer allowed.', 'info');
    }

    /* Refund submit (sends seller email + onsite notification) */
    function submitRefund() {
      const reason = document.getElementById('refundReason').value.trim();
      if(!reason){ alert('Please describe the issue.'); return; }
      if(!lastOrderDetails){ alert('No recent order found.'); return; }

      lastOrderDetails.status = 'refund_requested';

      const txt = `REFUND REQUEST\nCustomer: ${lastOrderDetails.name} (${lastOrderDetails.email})\nReason:\n${reason}\n\nOrder details:\n${lastOrderDetails.details}`;

      document.getElementById('sellerOrderDetails').value = txt;
      document.getElementById('sellerCustomerName').value = lastOrderDetails.name;
      document.getElementById('sellerCustomerEmail').value = lastOrderDetails.email;

      try { document.getElementById('sellerForm').submit(); } catch(e) { console.warn('Seller form submit failed:', e); }
      closeModal();

      pushSiteNotification('Refund Request Sent', 'We received your refund request — BuildSmart PH will contact you at your email.', 'info');
      alert('Refund request sent to BuildSmart PH support. We will contact you via email.');
    }

    function openModal(mode){ document.getElementById('modalTitle').innerText = mode==='refund' ? 'Request Refund' : 'Modal'; document.getElementById('modal').style.display = 'flex'; }
    function closeModal(){ document.getElementById('modal').style.display = 'none'; }

    function viewReceipt(){
      if(!lastOrderDetails){ alert('No recent order'); return; }
      // small readable alert for demo; replace with a nice popup if desired
      alert(lastOrderDetails.details);
    }

    /* Checkout: creates lastOrderDetails, emails buyer & seller via FormSubmit */
    function checkout() {
      if(Object.keys(cart).length === 0){ alert('Cart is empty'); return; }
      const name = document.getElementById('buyerName').value.trim();
      const email = document.getElementById('buyerEmail').value.trim();
      const address = document.getElementById('buyerAddress').value.trim();
      const phone = document.getElementById('buyerPhone').value.trim();
      if(!name||!email||!address||!phone){ alert('Please fill name, email, address, and phone'); return; }

      let subtotal = 0;
      let details = 'BuildSmart PH — E-Receipt\n\n';
      details += `Customer: ${name}\nEmail: ${email}\nPhone: ${phone}\nAddress: ${address}\n\nItems:\n`;
      for(const [k,item] of Object.entries(cart)){
        const line = item.qty * item.price;
        subtotal += line;
        details += `${item.title} (${k}) x${item.qty} — ₱${line.toLocaleString()}\n`;
      }
      const shipping = parseInt(document.getElementById('shipping').value||'0');
      const paymentMethod = document.getElementById('paymentMethod').value;
      const voucher = parseInt(document.getElementById('voucher').value||'0');
      voucherDiscount = voucher;
      const total = Math.max(0, subtotal + shipping - voucherDiscount);
      details += `\nSubtotal: ₱${subtotal.toLocaleString()}\nShipping: ₱${shipping.toLocaleString()}\nDiscount: ₱${voucherDiscount}\nTotal: ₱${total.toLocaleString()}\nPayment: ${paymentMethod}\n`;

      const confirmed = confirm('Confirm order? OK to submit and email receipt. Cancel to review order.');
      if(!confirmed) return;

      const id = 'ORD-' + Date.now();
      lastOrderDetails = { id, details, name, email, total, status: 'pending' };

      // send seller email (your FormSubmit endpoint)
      document.getElementById('sellerOrderDetails').value = `Order ID: ${id}\n\n` + details;
      document.getElementById('sellerCustomerName').value = name;
      document.getElementById('sellerCustomerEmail').value = email;
      try { document.getElementById('sellerForm').submit(); } catch(e){ console.warn('Seller form submit failed:', e); }

      // send buyer email (FormSubmit to buyer's email so they get an e-receipt)
      const buyerForm = document.getElementById('buyerForm');
      buyerForm.action = 'https://formsubmit.co/' + encodeURIComponent(email);
      document.getElementById('buyerOrderDetails').value = `Order ID: ${id}\n\n` + details;
      document.getElementById('buyerCustomerName').value = name;
      try { buyerForm.submit(); } catch(e){ console.warn('Buyer form submit failed:', e); }

      alert('Order placed! An e-receipt has been emailed to you.');
      renderOrderResult();

      // clear cart & inputs
      cart = {}; voucherDiscount = 0;
      document.getElementById('voucher').value = '0';
      document.getElementById('buyerName').value=''; document.getElementById('buyerEmail').value=''; document.getElementById('buyerAddress').value=''; document.getElementById('buyerPhone').value='';
      renderCart();
    }

    function toggleCart(show=true){
      const panel = document.getElementById('cartPanel');
      panel.style.display = show? 'block' : 'none';
    }

    // initial render
    renderProducts();
    renderCart();

    // expose helper to console for testing (simulate shipping)
    window.simulateShipLastOrder = simulateShipLastOrder;

    // Optional: if you want to change products dynamically, edit the `products` array above.
  </script>
</body>
</html>
